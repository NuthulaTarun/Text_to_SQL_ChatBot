steps:
# Build the Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', '${_REPOSITORY}/${_PROJECT}/${_IMAGE_NAME}:$SHORT_SHA', '.']

# Push the image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_REPOSITORY}/${_PROJECT}/${_IMAGE_NAME}:$SHORT_SHA']

# Deploy to existing Cloud Run service
- name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'run'
  - 'deploy'
  - '${_EXISTING_SERVICE_NAME}'  # Use your existing service name here
  - '--image'
  - '${_REPOSITORY}/${_PROJECT}/${_IMAGE_NAME}:$SHORT_SHA'
  - '--region'
  - '${_REGION}'
  - '--platform'
  - 'managed'

images:
- '${_REPOSITORY}/${_PROJECT}/${_IMAGE_NAME}:$SHORT_SHA'

substitutions:
  _PROJECT: 
  _REGION: us-central1  # Your service's region
  _REPOSITORY: gcr.io  # Your Artifact Registry repository
  _IMAGE_NAME: marketing-analytics-bot  # Name for your Docker image
  _EXISTING_SERVICE_NAME: marketing-analytics-bot  # Your existing Cloud Run service name

options:
  logging: CLOUD_LOGGING_ONLY